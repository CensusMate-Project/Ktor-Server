services:
  database:
    image: postgres:17
    container_name: censusmate-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: censusmate
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
#    ports:
#      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U user -d censusmate" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: censusmate-server
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SERVER_HOST: 0.0.0.0
      DB_URL: jdbc:postgresql://db:5432/censusmate?sslmode=disable
      DB_USER: user
      DB_PASSWORD: password
    ports:
      - "3000:3000"

volumes:
  postgres_data:
